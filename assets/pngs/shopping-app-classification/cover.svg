<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Shopping app review classification</title>
  <desc id="desc">A review text flows through an NLP encoder into one of eleven shopping app labels, with project metrics below.</desc>
  <rect width="1200" height="1200" fill="#102018"/>
  <g opacity=".11" stroke="#d6ff68" stroke-width="2">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200"/>
    <path d="M120 0V1200M240 0V1200M360 0V1200M480 0V1200M600 0V1200M720 0V1200M840 0V1200M960 0V1200M1080 0V1200"/>
  </g>
  <text x="70" y="86" fill="#d6ff68" font-family="Arial, sans-serif" font-size="22" letter-spacing="6">NATURAL LANGUAGE PROCESSING</text>
  <text x="70" y="174" fill="#f3f1e8" font-family="Arial, sans-serif" font-size="64" font-weight="700">Which app wrote</text>
  <text x="70" y="242" fill="#f3f1e8" font-family="Arial, sans-serif" font-size="64" font-weight="700">the review?</text>

  <g transform="translate(70 350)">
    <rect width="310" height="285" rx="20" fill="#f3f1e8"/>
    <circle cx="42" cy="44" r="13" fill="#d6ff68" stroke="#102018" stroke-width="4"/>
    <rect x="70" y="33" width="150" height="10" rx="5" fill="#8b958f"/>
    <rect x="70" y="53" width="100" height="8" rx="4" fill="#c5cbc7"/>
    <text x="28" y="118" fill="#102018" font-family="Georgia, serif" font-size="24">“Delivery was fast,</text>
    <text x="28" y="154" fill="#102018" font-family="Georgia, serif" font-size="24">but checkout kept</text>
    <text x="28" y="190" fill="#102018" font-family="Georgia, serif" font-size="24">losing my cart...”</text>
    <g fill="#102018"><circle cx="34" cy="238" r="5"/><circle cx="52" cy="238" r="5"/><circle cx="70" cy="238" r="5"/><circle cx="88" cy="238" r="5"/><circle cx="106" cy="238" r="5"/></g>
  </g>

  <path d="M405 492H475" stroke="#d6ff68" stroke-width="9" stroke-linecap="round"/>
  <path d="m453 470 28 22-28 22" fill="none" stroke="#d6ff68" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(510 375)">
    <rect width="220" height="235" rx="25" fill="#d6ff68"/>
    <text x="110" y="62" text-anchor="middle" fill="#102018" font-family="Arial, sans-serif" font-size="19" letter-spacing="4">ENCODER</text>
    <g fill="#102018"><rect x="38" y="96" width="144" height="18" rx="9" opacity=".42"/><rect x="52" y="132" width="116" height="18" rx="9" opacity=".62"/><rect x="67" y="168" width="86" height="18" rx="9" opacity=".82"/></g>
  </g>

  <path d="M755 492H825" stroke="#d6ff68" stroke-width="9" stroke-linecap="round"/>
  <path d="m803 470 28 22-28 22" fill="none" stroke="#d6ff68" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(860 340)" font-family="Arial, sans-serif">
    <rect width="270" height="305" rx="24" fill="#254135" stroke="#d6ff68" stroke-width="3"/>
    <text x="135" y="57" text-anchor="middle" fill="#d6ff68" font-size="20" letter-spacing="4">11 LABELS</text>
    <g fill="#f3f1e8" font-size="19">
      <text x="28" y="105">Amazon</text><text x="150" y="105">Walmart</text>
      <text x="28" y="145">Alibaba</text><text x="150" y="145">Lazada</text>
      <text x="28" y="185">Shein</text><text x="150" y="185">Myntra</text>
      <text x="28" y="225">Meesho</text><text x="150" y="225">Flipkart</text>
      <text x="28" y="265">+ 3 more</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="770" width="500" height="145" rx="18" fill="#1b3328"/>
    <text x="105" y="836" fill="#d6ff68" font-size="48" font-weight="700">630K</text>
    <text x="105" y="875" fill="#aebbb4" font-size="18" letter-spacing="3">REVIEWS · 11 PLATFORMS</text>
    <rect x="630" y="770" width="500" height="145" rx="18" fill="#1b3328"/>
    <text x="665" y="836" fill="#d6ff68" font-size="48" font-weight="700">7</text>
    <text x="665" y="875" fill="#aebbb4" font-size="18" letter-spacing="3">TRANSFORMER MODELS</text>
    <rect x="70" y="950" width="500" height="145" rx="18" fill="#1b3328"/>
    <text x="105" y="1016" fill="#d6ff68" font-size="48" font-weight="700">0.7725</text>
    <text x="105" y="1055" fill="#aebbb4" font-size="18" letter-spacing="3">BEST TEST MACRO-F1</text>
    <rect x="630" y="950" width="500" height="145" rx="18" fill="#1b3328"/>
    <text x="665" y="1016" fill="#d6ff68" font-size="48" font-weight="700">0.8893</text>
    <text x="665" y="1055" fill="#aebbb4" font-size="18" letter-spacing="3">TOP-2 ACCURACY</text>
  </g>
</svg>
